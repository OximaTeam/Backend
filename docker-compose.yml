volumes:
  postgres-vol:
    driver: local

networks:
  postgres-net:
    driver: bridge

services:
  postgres:
    container_name: postgres
    image: postgres:16.1-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres-vol:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    networks:
      - postgres-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s